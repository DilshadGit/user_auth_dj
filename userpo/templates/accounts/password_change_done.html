{% extends "base.html" %}

{% block title %}Password Changed{% endblock %}

{% block content %}
<main class="account-shell">
    <div class="container">
        <div class="account-card">
            <div class="account-header">
                <p class="account-kicker">Security</p>
                <h1 class="account-title">Password Changed</h1>
            </div>

            <div class="account-message">
                Your password has been updated successfully. Keep it secure and use it the next time you sign in.
            </div>

            <div class="account-actions">
                <a href="{% url 'accounts:dashboard' %}" class="btn btn-primary account-button">Back to dashboard</a>
            </div>
        </div>
    </div>
</main>
{% endblock %}
