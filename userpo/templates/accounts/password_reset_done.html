{% extends "base.html" %}

{% block title %}Password Reset Sent{% endblock %}

{% block content %}
<main class="account-shell">
    <div class="container">
        <div class="account-card">
            <div class="account-header">
                <p class="account-kicker">Account</p>
                <h1 class="account-title">Check Your Email</h1>
            </div>

            <div class="account-message">
                We have sent a password reset link to your email address. Please follow the instructions in that message to continue.
            </div>
        </div>
    </div>
</main>
{% endblock %}
