{% extends "base.html" %}

{% block title %}Reset Password{% endblock %}

{% block content %}
<main class="account-shell">
    <div class="container">
        <div class="account-card">
            <div class="account-header">
                <p class="account-kicker">Account</p>
                <h1 class="account-title">Reset Password</h1>
            </div>

            <form method="post" class="account-form">
                {% csrf_token %}

                {% if form.email.errors %}
                    <div class="field-error">{{ form.email.errors }}</div>
                {% endif %}

                <div>
                    <label for="{{ form.email.id_for_label }}">Email address</label>
                    {{ form.email }}
                </div>

                <div class="account-actions">
                    <button type="submit" class="btn btn-primary account-button">Send reset link</button>
                    <a href="{% url 'accounts:login' %}" class="btn btn-outline-secondary account-button">Back to login</a>
                </div>
            </form>
        </div>
    </div>
</main>
{% endblock %}
